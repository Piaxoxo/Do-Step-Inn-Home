name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/do-step-inn-home-eiit7m"]
  workflow_dispatch:

# Allow the workflow to publish to Pages via the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; let in-progress runs finish
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Auto-enables Pages (build type: GitHub Actions) on first run — public repo
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is a static folder at the repo root — upload it as-is
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
